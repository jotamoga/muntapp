<html lang="ca">
<head>

<title>MuntApp · EAP La Muntanyeta</title>

<style>
/* Layout: a home with two doors (MuntApp for professionals, InnovaMunt for patients and families); each opens a mobile-first screen */
:root{
  --bg:#E6ECEA; --surface:#FBFCFC; --card:#FFFFFF; --sunk:#EBF0EF; --ink:#0E2A30; --muted:#4F6166; --line:#D3DCDA;
  --accent:#2F6FB0; --accent-soft:#E1ECF7; --on-accent:#FFFFFF; --warm:#C4621F; --warm-soft:#FBEADD; --short:#8FB3D9; --support:#E8833A;
  --ok:#1F7A52; --ok-bg:#DCF0E5; --warn:#8F5E00; --warn-bg:#FBEFD2; --bad:#B8352B; --bad-bg:#F9DEDB; --sil:#5B4FA0; --sil-bg:#E9E5F6;
  --icc:#B8352B; --pcc:#2F6FB0; --maca:#6B4FA0; --atdom:#1F7A52; --dm2:#A2560E;
  --sans:'IBM Plex Sans',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071417; --surface:#0E2328; --card:#132C32; --sunk:#183339; --ink:#E7EFEE; --muted:#9FB4B7; --line:#25444B;
  --accent:#73A9E2; --accent-soft:#1A3450; --on-accent:#0B1E22; --warm:#F0A36A; --warm-soft:#3A2617; --short:#3D6E9E; --support:#F0A36A;
  --ok:#62CB9B; --ok-bg:#143A2A; --warn:#F2C14E; --warn-bg:#3A2F12; --bad:#F27D71; --bad-bg:#3F1E1B; --sil:#B9AEF0; --sil-bg:#2A2547;
  --icc:#F27D71; --pcc:#73A9E2; --maca:#B79BEA; --atdom:#62CB9B; --dm2:#F0B070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071417; --surface:#0E2328; --card:#132C32; --sunk:#183339; --ink:#E7EFEE; --muted:#9FB4B7; --line:#25444B;
  --accent:#73A9E2; --accent-soft:#1A3450; --on-accent:#0B1E22; --warm:#F0A36A; --warm-soft:#3A2617; --short:#3D6E9E; --support:#F0A36A;
  --ok:#62CB9B; --ok-bg:#143A2A; --warn:#F2C14E; --warn-bg:#3A2F12; --bad:#F27D71; --bad-bg:#3F1E1B; --sil:#B9AEF0; --sil-bg:#2A2547;
  --icc:#F27D71; --pcc:#73A9E2; --maca:#B79BEA; --atdom:#62CB9B; --dm2:#F0B070; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button,select,input,textarea{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--warm);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.narrow{max-width:520px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;cursor:pointer;padding:0;text-align:left}
.lights{display:flex;flex-direction:column;gap:3px}.lights i{width:9px;height:9px;border-radius:50%;display:block}
.brand b{font-size:20px;letter-spacing:-.01em;display:block;line-height:1.1}.brand small{color:var(--muted);font-size:12.5px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px;white-space:nowrap;color:var(--warm);background:var(--warm-soft)}
.back{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer}
h1,h2,h3{margin:0}
.note{font-size:12.5px;color:var(--muted);margin:0}
.hero{padding:18px 4px 4px;display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:30px;line-height:1.1;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.door{border:0;border-radius:22px;padding:22px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:210px;color:inherit;font:inherit}
.door.mun{background:var(--ink);color:var(--bg)}
.door.inn{background:var(--card);border:2px solid var(--accent)}
.door .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.door.mun .ic{background:rgba(255,255,255,.12)}.door.inn .ic{background:var(--accent-soft);color:var(--accent)}
.door b{font-size:24px;letter-spacing:-.01em}
.door span{font-size:14px;opacity:.85}
.door em{font-style:normal;margin-top:auto;font-weight:700;font-size:14px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.how b{display:block;font-size:14px;margin-bottom:2px}
.how span{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.step{display:flex;flex-direction:column;gap:8px}
.stepn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.stepn i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;flex:none}
select,input[type=text],textarea{font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
.who{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:13.5px}
.chip{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;color:var(--on-accent);white-space:nowrap}
.stepper{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:6px;align-items:center}
.stepper button{height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font-size:22px;font-weight:600;cursor:pointer}
.stepper input{height:46px;text-align:center;font:600 20px var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;padding:0}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13.5px;font-weight:600}.fld>span em{font-style:normal;font-weight:500;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .stepper{grid-template-columns:38px minmax(0,1fr) 38px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{flex:1;min-width:52px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:10px 6px;border-radius:12px;cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14.5px;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--bad);flex:none}
.checks label.crit{border-color:var(--bad)}
.checks small{margin-left:auto;font-size:11px;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.04em}
.photo{display:flex;gap:10px;align-items:center;position:relative}
.photo label{border:1px dashed var(--muted);border-radius:12px;padding:11px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface)}
.photo input{position:absolute;width:1px;height:1px;opacity:0;left:0;top:0}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.dest{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dest button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:64px;font:inherit}
.dest button b{font-size:14.5px}.dest button span{font-size:12px;color:var(--muted)}
.dest button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.dest button em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.send{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;padding:15px;border-radius:14px;cursor:pointer;width:100%}
.result{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.result b{font-size:16px}
.result.ok{background:var(--ok-bg);color:var(--ok)}.result.warn{background:var(--warn-bg);color:var(--warn)}.result.bad{background:var(--bad-bg);color:var(--bad)}
.route{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink)}
.route span{background:var(--card);border-radius:8px;padding:3px 8px;font-weight:600}
.route s{opacity:.6}
.e112{background:var(--bad);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto}
.tabs button{flex:1;min-width:max-content;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.cnt{font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;line-height:17px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.k-bad b{color:var(--bad)}.kpi.k-sil b{color:var(--sil)}.kpi.k-ok b{color:var(--ok)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg{display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--line)}
.msg.alta{border-left-color:var(--bad)}.msg.normal{border-left-color:var(--accent)}.msg.done{opacity:.65;border-left-color:var(--ok)}
.mh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.mh .code{font-family:var(--mono);font-weight:600}
.signs{display:flex;gap:6px;flex-wrap:wrap}
.signs span{font-size:12px;font-weight:600;background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:3px 9px}
.vals{display:flex;gap:6px;flex-wrap:wrap}
.vals span{font-family:var(--mono);font-size:12.5px;background:var(--sunk);border-radius:8px;padding:3px 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13px;padding:8px 11px;border-radius:9px;cursor:pointer}
.acts button.sec{background:var(--sunk);color:var(--ink)}
.log{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;display:flex;flex-direction:column;gap:1px}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.bad,.pill.alta{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.silence{background:var(--sil-bg);color:var(--sil)}.pill.normal{background:var(--accent-soft);color:var(--accent)}.pill.off{background:var(--sunk);color:var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:6px minmax(0,1fr) 110px auto;gap:12px;align-items:center;padding:11px 12px 11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.stripe{align-self:stretch;border-radius:0 4px 4px 0}
.why{font-size:13px;font-weight:600}.why.bad{color:var(--bad)}.why.warn{color:var(--warn)}.why.silence{color:var(--sil)}.why.ok{color:var(--ok)}
.l2{font-size:12.5px;color:var(--muted)}
.when{font-size:12.5px;color:var(--muted);text-align:right}.when b{display:block;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.ctl{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.seg2{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg2 button{border:0;background:transparent;color:var(--ink);font-weight:600;font-size:13.5px;padding:6px 10px;border-radius:7px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ctrls select{width:auto;font-size:14px;padding:7px 10px;background:var(--sunk);border:0}
.urow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;color:inherit;font:inherit;cursor:pointer}
.urow:first-of-type{border-top:0}
.urow .nm{font-weight:700;line-height:1.15}.urow .nm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.slots{display:flex;gap:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.slots b{font-family:var(--mono);color:var(--ink);font-size:15px}.slots b.neg{color:var(--bad)}
.sbar{grid-column:1 / 4;position:relative;height:12px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.sbar span{height:100%;transition:width .5s}
.sbar .cap{position:absolute;top:-2px;bottom:-2px;border-left:2px solid var(--ink);opacity:.6}
.sbar .t85{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--ink);opacity:.3}
.sup{background:repeating-linear-gradient(135deg,var(--support) 0 4px,transparent 4px 7px)}
.udet{grid-column:1 / 4;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:9px 11px}.udet b{color:var(--ink)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.alerts{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{border-left:4px solid var(--line);background:var(--sunk);border-radius:6px;padding:8px 10px;font-size:13.5px}
.alerts li.bad{border-color:var(--bad)}.alerts li.warn{border-color:var(--warn)}.alerts li.ok{border-color:var(--ok)}.alerts li.info{border-color:var(--accent)}
.studies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pbar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}.pbar span{display:block;height:100%;border-radius:99px}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini2 div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.mini2 b{display:block;font-family:var(--mono);font-size:19px}.mini2 span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;padding:11px 16px;border-radius:12px;z-index:20;max-width:calc(100% - 28px)}
.ai{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ai .aih{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.ai b.big{font-size:17px}
.ai .meta{display:flex;gap:6px;flex-wrap:wrap}
.ai .meta span{font-size:12px;font-weight:600;background:var(--card);border-radius:999px;padding:3px 9px}
.btn2{border:1.5px solid var(--accent);background:var(--card);color:var(--accent);font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;cursor:pointer;align-self:flex-start}
.aitag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 8px;align-self:flex-start}
.prop{display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--accent)}
.prop.emer{border-left-color:var(--sil)}
@media (max-width:860px){.dgrid,.studies{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.doors{grid-template-columns:1fr}.door{min-height:0}.how{grid-template-columns:1fr}
  .row{grid-template-columns:6px minmax(0,1fr) auto}.row .spk{display:none}
  .tabs{flex-wrap:wrap}.tabs button{flex:1 1 30%;min-width:0;font-size:13px;padding:9px 6px}}
@media (prefers-reduced-motion:reduce){.sbar span{transition:none}}
</style>
</head>
<body>
<div class="wrap">

    <button class="brand" type="button" data-go="home" aria-label="Inici">

</div>

    u.push({i:i,sp:(b[1]+b[4])*f*gm,pr:b[0]+b[2],sh:b[3]*(grip?0.3:1),sup:0,mf:b[0]+b[1]*f*gm,inf:b[2]+b[3]*(grip?0.3:1)+b[4]*f*gm,absent:i===dm.abs})}
  if(dm.abs>=0){var a=u[dm.abs],mt=Math.floor(dm.abs/5),ms=u.filter(function(x){return Math.floor(x.i/5)===mt&&!x.absent}),k=ms.length;ms.forEach(function(m){m.sup=(a.mf+a.inf)/k;m.mf+=a.mf/k;m.inf+=a.inf/k});a.sp=a.pr=a.sh=a.mf=a.inf=0}
  u.forEach(function(x){x.mfFree=Math.round(MFC-x.mf);x.inFree=Math.round(INC-x.inf);x.min=Math.max(0,x.mfFree)*10+Math.max(0,x.inFree)*15;x.forced=Math.max(0,-x.mfFree)+Math.max(0,-x.inFree);x.occ=x.absent?0:Math.round((x.mf+x.inf)/(MFC+INC)*100);x.st=x.absent?"off":(x.forced>0||x.occ>100)?"bad":x.occ>=85?"warn":"ok"});
  return u;
}

function hasOption(prof,name){return PROB[prof].some(function(x){return norm(x.n)===norm(name)})}
function freeStats(){
  var now=Date.now(),F=S.free.filter(function(f){return now-f.t<30*D}),G={};
  F.forEach(function(f){var k=f.id?"m:"+f.id:"k:"+f.key;G[k]=G[k]||{k:k,id:f.id,key:f.key,n:0,profs:{},last:0,ex:f.text};var g=G[k];g.n++;g.profs[f.prof]=1;if(f.t>g.last){g.last=f.t;g.ex=f.text}});
  return Object.keys(G).map(function(k){return G[k]}).sort(function(a,b){return b.n-a.n});
}
function motiu(id){return MOTIUS.filter(function(m){return m.id===id})[0]}
function proposals(){
  return freeStats().filter(function(g){
    if(g.n<3)return false;
    if(g.id){var m=motiu(g.id);return Object.keys(g.profs).some(function(pf){return!hasOption(pf,m.n)})}
    return true;
  });
}

function propAct(k,a){

  if(a==="no"){S.free=S.free.filter(function(f){return("m:"+f.id)!==k&&("k:"+f.key)!==k});toast("Proposta descartada");render();return}
  if(a==="add"){var m=motiu(g.id);Object.keys(g.profs).forEach(function(pf){if(!hasOption(pf,m.n))PROB[pf].push({n:m.n,to:m.to,s:m.s})});S.created.push(m.n+" ("+Object.keys(g.profs).join(", ")+")");toast("«"+m.n+"» ja surt a la llista d’InnovaMunt")}
  if(a==="new"){var nm=g.key.charAt(0).toUpperCase()+g.key.slice(1),id="nou_"+g.key;
    MOTIUS.unshift({id:id,n:nm,cat:"Nou",to:"inf",kw:[g.key],s:[sg("Dura més de 2 dies"),sg("No pot menjar o dormir"),sg("Empitjora")]});
    Object.keys(g.profs).forEach(function(pf){if(!hasOption(pf,nm))PROB[pf].push({n:nm,to:"inf",s:[sg("Dura més de 2 dies"),sg("No pot menjar o dormir"),sg("Empitjora")]})});
    S.free.forEach(function(f){if(f.key===g.key){f.id=id;delete f.key}});
    S.created.push(nm+" (categoria nova, signes provisionals)");toast("Categoria «"+nm+"» creada")}
  render();
}

  else if(t.id==="iWhat"){I.what=t.value;I.to=null;I.signs={};I.result=null;render()}
  else if(t.id==="iProb"){I.prob=t.value==="other"?"other":+t.value;I.signs={};I.to=null;I.ai=null;render()}
  else if(t.id==="iTram"){I.tram=+t.value}
  else if(t.dataset&&t.dataset.sign!=null){I.signs[t.dataset.sign]=t.checked}
  else if(t.id==="iPhoto"&&t.files&&t.files[0]){try{if(I.photo)URL.revokeObjectURL(I.photo)}catch(x){}I.photo=URL.createObjectURL(t.files[0]);render()}
  else if(t.id==="dAbs"){ui.dm.abs=+t.value;ui.dm.open=-1;render()}
});
app.addEventListener("input",function(e){
  var t=e.target,I=ui.inn;
  if(t.dataset&&t.dataset.k){var n=parseFloat(String(t.value).replace(",","."));I.vals[t.dataset.k]=isNaN(n)?"":n}
  else if(t.id==="iNote")I.note=t.value;else if(t.id==="iFree"){I.free=t.value;if(I.ai){I.ai=null}}else if(t.id==="iMed")I.med=t.value;
});
render();
})();
</script>
</body>
</html>
