<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MuntApp · EAP La Muntanyeta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#E6ECEA; --surface:#FBFCFC; --card:#FFFFFF; --sunk:#EBF0EF; --ink:#0E2A30; --muted:#4F6166; --line:#D3DCDA;
  --accent:#2F6FB0; --accent-soft:#E1ECF7; --on-accent:#FFFFFF; --warm:#C4621F; --warm-soft:#FBEADD; --short:#8FB3D9; --support:#E8833A;
  --ok:#1F7A52; --ok-bg:#DCF0E5; --warn:#8F5E00; --warn-bg:#FBEFD2; --bad:#B8352B; --bad-bg:#F9DEDB; --sil:#5B4FA0; --sil-bg:#E9E5F6;
  --icc:#B8352B; --pcc:#2F6FB0; --maca:#6B4FA0; --atdom:#1F7A52; --dm2:#A2560E;
  --sans:'IBM Plex Sans',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071417; --surface:#0E2328; --card:#132C32; --sunk:#183339; --ink:#E7EFEE; --muted:#9FB4B7; --line:#25444B;
  --accent:#73A9E2; --accent-soft:#1A3450; --on-accent:#0B1E22; --warm:#F0A36A; --warm-soft:#3A2617; --short:#3D6E9E; --support:#F0A36A;
  --ok:#62CB9B; --ok-bg:#143A2A; --warn:#F2C14E; --warn-bg:#3A2F12; --bad:#F27D71; --bad-bg:#3F1E1B; --sil:#B9AEF0; --sil-bg:#2A2547;
  --icc:#F27D71; --pcc:#73A9E2; --maca:#B79BEA; --atdom:#62CB9B; --dm2:#F0B070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071417; --surface:#0E2328; --card:#132C32; --sunk:#183339; --ink:#E7EFEE; --muted:#9FB4B7; --line:#25444B;
  --accent:#73A9E2; --accent-soft:#1A3450; --on-accent:#0B1E22; --warm:#F0A36A; --warm-soft:#3A2617; --short:#3D6E9E; --support:#F0A36A;
  --ok:#62CB9B; --ok-bg:#143A2A; --warn:#F2C14E; --warn-bg:#3A2F12; --bad:#F27D71; --bad-bg:#3F1E1B; --sil:#B9AEF0; --sil-bg:#2A2547;
  --icc:#F27D71; --pcc:#73A9E2; --maca:#B79BEA; --atdom:#62CB9B; --dm2:#F0B070; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button,select,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--warm);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted)}
.lbl{display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
body[data-screen="inn"] .wrap,body[data-screen="home"] .wrap{max-width:900px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.lights{display:flex;flex-direction:column;gap:3px}.lights i{width:9px;height:9px;border-radius:50%;display:block}
.brand b{font-size:19px;letter-spacing:-.01em;display:block;line-height:1.1}.brand small{color:var(--muted);font-size:12px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px;white-space:nowrap;color:var(--warm);background:var(--warm-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:6px 0;display:inline-flex;gap:4px;align-items:center;text-align:left}
.chip{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;color:var(--on-accent);white-space:nowrap}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.bad,.pill.alta{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.silence{background:var(--sil-bg);color:var(--sil)}.pill.normal{background:var(--accent-soft);color:var(--accent)}.pill.off{background:var(--sunk);color:var(--muted)}
.signs{display:flex;gap:6px;flex-wrap:wrap}
.signs span{font-size:12px;font-weight:600;background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:3px 9px}
.vals{display:flex;gap:6px;flex-wrap:wrap}
.vals span{font-family:var(--mono);font-size:12.5px;background:var(--sunk);border-radius:8px;padding:3px 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13px;padding:9px 12px;border-radius:10px;display:inline-flex;gap:6px;align-items:center}
.acts button.sec{background:var(--sunk);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;padding:11px 16px;border-radius:12px;z-index:20;max-width:calc(100% - 32px)}
select,input[type=text],textarea{font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
textarea{min-height:76px;resize:vertical}
.legend{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:-6px}
.sech{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sech h3{font-size:15.5px}
.pic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.pic.sm{width:28px;height:28px;border-radius:9px}.pic.lg{width:60px;height:60px;border-radius:18px}
:root[data-theme="dark"] .pic,:root:not([data-theme="light"]) .pic{color:#fff}

/* home */
.home{display:flex;flex-direction:column;gap:16px}
.hero{padding:14px 2px 2px;display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:clamp(26px,6vw,34px);line-height:1.1;letter-spacing:-.015em}
.hero p{color:var(--muted);max-width:56ch}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.door{border:0;border-radius:22px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:220px;font:inherit}
.door.mun{background:var(--ink);color:var(--bg)}
.door.inn{background:var(--accent);color:var(--on-accent)}
.door .ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.door b{font-size:25px;letter-spacing:-.01em}
.door span{font-size:14px;opacity:.9}
.door em{font-style:normal;margin-top:auto;font-weight:700;font-size:14.5px;display:flex;gap:4px;align-items:center}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.how .hn{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;margin-bottom:4px}
.how b{font-size:14px}.how span{font-size:13px;color:var(--muted)}

/* ===== InnovaMunt wizard (mobile first) ===== */
.phone-col{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.wh{display:flex;flex-direction:column;gap:8px}
.wtop{display:flex;align-items:center;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.prog{display:flex;gap:4px;flex:1;min-width:0}
.prog span{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.prog i{height:5px;border-radius:9px;background:var(--line)}
.prog em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .done i{background:var(--accent)}.prog .on i{background:var(--warm)}.prog .on em{color:var(--ink)}
.wh h2{font-size:24px;line-height:1.15;letter-spacing:-.01em;margin-top:4px}
.patbar{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:8px 10px;font-size:13.5px}
.patbar .pic{width:30px;height:30px;border-radius:9px}
.tiles1{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;font:inherit;display:flex;gap:12px;align-items:center;position:relative;transition:transform .12s,border-color .12s}
.tile:active{transform:scale(.98)}
.tile:hover{border-color:var(--accent)}
.tile .tt{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.tile .tt b{font-size:16px;line-height:1.25}.tile .tt span{font-size:13px;color:var(--muted)}
.tile .chev{color:var(--muted);display:flex}
.tile.slim{padding:13px 14px;border-radius:14px}.tile.slim .tt b{font-size:15px;font-weight:600}
.tile.sel{border:2px solid var(--accent);background:var(--accent-soft)}
.tile.sq{flex-direction:column;align-items:flex-start;gap:6px;min-height:150px;padding:16px}
.tile.sq b{font-size:16.5px;line-height:1.2}.tile.sq>span:last-child{font-size:12.5px;color:var(--muted)}
.tile.cat{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 6px;min-height:104px;border-radius:16px}
.tile.cat b{font-size:12.5px;line-height:1.2;font-weight:600}
.bigic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none}
.bigic.soft{background:var(--accent-soft);color:var(--accent)}
.tile.cat .bigic{width:44px;height:44px;border-radius:14px}
.tile.rec{border:2px solid var(--accent)}
.recb{position:absolute;top:10px;right:10px;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2px 8px}
.searchbox{background:var(--card);border:1.5px solid var(--accent);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.searchbox .lbl{color:var(--accent)}
.sin{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.sin input{border:0;background:transparent;padding:13px 0;outline:none;color:var(--ink)}
.sin:focus-within{outline:2px solid var(--warm);outline-offset:1px}
.sin.sm input{padding:9px 0;font-size:14.5px}
#sugg{display:flex;flex-direction:column;gap:6px}
.sug{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;font:inherit}
.sug.first{border:2px solid var(--accent);background:var(--accent-soft)}
.sug .sic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card);color:var(--accent);flex:none}
.sug .tt{display:flex;flex-direction:column;flex:1;min-width:0}.sug .tt b{font-size:15px}.sug .tt span{font-size:12px;color:var(--muted)}
.conf{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.c-alta{background:var(--ok-bg);color:var(--ok)}.c-mitjana{background:var(--warn-bg);color:var(--warn)}.c-baixa{background:var(--sunk);color:var(--muted)}
.chips2{display:flex;gap:8px;flex-wrap:wrap}
.pchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px;font-weight:600;font-size:14px}
.pchip:hover{border-color:var(--accent)}
.signs2{display:flex;flex-direction:column;gap:8px}
.sig{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;text-align:left;font:inherit;font-size:15px;font-weight:500}
.sig .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.sig em{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--bad)}
.sig.crit{border-color:var(--bad)}
.sig[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn)}
.sig[aria-pressed="true"] .box{background:var(--warn);border-color:var(--warn);color:#fff}
.sig.crit[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad)}
.sig.crit[aria-pressed="true"] .box{background:var(--bad);border-color:var(--bad)}
.photo{display:flex;gap:10px;align-items:center;position:relative}
.photo label{border:1.5px dashed var(--muted);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;background:var(--surface);display:flex;gap:6px;align-items:center;cursor:pointer}
.photo input{position:absolute;width:1px;height:1px;opacity:0;left:0;top:0}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.fld{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.fld>span{font-size:14px;font-weight:600}.fld>span em{font-style:normal;font-weight:500;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stepper{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:6px;align-items:center}
.pair .stepper{grid-template-columns:38px minmax(0,1fr) 38px}
.stepper button{height:48px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:22px;font-weight:600}
.stepper input{height:48px;text-align:center;font:600 20px var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;padding:0}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{flex:1;min-width:52px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;padding:11px 6px;border-radius:12px}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.send{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16.5px;padding:16px;border-radius:16px;width:100%;margin-top:4px}
.send:disabled{opacity:.45;cursor:not-allowed}
.summary{display:flex;flex-direction:column;gap:0;padding:4px 14px}
.sr{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.sr:first-child{border-top:0}
.sr>span{font-size:13px;color:var(--muted);flex:none}.sr>b,.sr>div{text-align:right;justify-content:flex-end}
.prev{display:flex;gap:12px;align-items:center;border-radius:16px;padding:14px;font-size:14px}
.prev .pi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.prev.ok{background:var(--ok-bg)}.prev.ok .pi{background:var(--ok)}
.prev.warn{background:var(--warn-bg)}.prev.warn .pi{background:var(--warn)}
.prev.orange{background:var(--warm-soft)}.prev.orange .pi{background:var(--warm)}
.prev.bad{background:var(--bad-bg)}.prev.bad .pi{background:var(--bad)}
.prev.blue{background:var(--accent-soft)}.prev.blue .pi{background:var(--accent)}
.done-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:18px}
.bigstat{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;color:#fff;animation:pop .35s ease-out}
.bigstat.ok{background:var(--ok)}.bigstat.warn{background:var(--warn)}.bigstat.orange{background:var(--warm)}.bigstat.bad{background:var(--bad)}.bigstat.blue{background:var(--accent)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.done-wrap h2{font-size:26px}.done-wrap>p{color:var(--muted);font-size:15.5px}
.route2{display:flex;align-items:center;gap:6px;width:100%;justify-content:center;margin:6px 0 4px}
.route2 .node{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px;min-width:0;flex:1;max-width:120px}
.route2 .node.off{opacity:.45;text-decoration:line-through}
.route2 .node.to{border:2px solid var(--ok);color:var(--ok)}
.route2 .arrow{width:14px;height:2px;background:var(--muted);flex:none}
.foot112{text-align:center;margin-top:8px}

/* ===== MuntApp (responsive: phone ↔ desktop) ===== */
.pro{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.pnav{position:sticky;top:12px;display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px}
.pnav button{display:flex;gap:10px;align-items:center;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:10px 12px;border-radius:10px;text-align:left}
.pnav button span{flex:1}
.pnav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.pnav button:hover:not([aria-current="page"]){background:var(--sunk);color:var(--ink)}
.cnt{font-style:normal;font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;line-height:18px;min-width:18px;text-align:center}
.pmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ptitle h2{font-size:22px;letter-spacing:-.01em}
.kpis5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;text-align:left;font:inherit;display:flex;flex-direction:column}
button.kpi:hover{border-color:var(--accent)}
.kpi b{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpis5.sm .kpi b{font-size:21px}
.k-bad b{color:var(--bad)}.k-sil b{color:var(--sil)}.k-ok b{color:var(--ok)}.k-warn b{color:var(--warn)}.k-acc b{color:var(--accent)}
.igrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.dgrid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pch{display:flex;gap:10px;align-items:center;border:0;background:none;padding:0;text-align:left;font:inherit}
.pch .tt{flex:1;min-width:0;display:flex;flex-direction:column}.pch .tt b{font-size:17px}.pch .tt span{font-size:12px;color:var(--muted);line-height:1.25}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--sunk)}
.stack span{display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:700;font-family:var(--mono);min-width:18px}
.pmeta{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}.pmeta b{color:var(--ink);font-family:var(--mono)}
.att{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:6px;gap:2px}

  u.forEach(function(x){x.mfFree=Math.round(MFC-x.mf);x.inFree=Math.round(INC-x.inf);x.min=Math.max(0,x.mfFree)*10+Math.max(0,x.inFree)*15;x.forced=Math.max(0,-x.mfFree)+Math.max(0,-x.inFree);x.occ=x.absent?0:Math.round((x.mf+x.inf)/(MFC+INC)*100);x.st=x.absent?"off":(x.forced>0||x.occ>100)?"bad":x.occ>=85?"warn":"ok"});

   card(["ICC"],"Seguiment proactiu de la insuficiència cardíaca amb la família","Hipòtesi: detectar la descompensació a casa redueix urgències i reingressos (fase 2, HC3).",icc.length,60,[[avg(icc)+"%","adherència"],[icc.filter(function(r){return r.s.st==="bad"}).length,"alertes actives"]])+
   card(["DM2"],"Hipoglucèmies i peu diabètic notificats des de casa","Variables: glucosa, hipoglucèmies i ferides al peu amb foto.",dm2.length,80,[[avg(dm2)+"%","adherència"],[S.msgs.filter(function(m){return S.patients[m.code].prog==="DM2"}).length,"notificacions"]])+
   card(["PCC","MACA"],"Pla compartit (PIIC) i control de símptomes","Variables: dolor, son, ingesta i sobrecàrrega del cuidador.",pm.length,40,[[avg(pm)+"%","adherència"],[pm.filter(function(r){return r.s.ev.why.some(function(w){return/Cuidador/.test(w)})}).length,"cuidadors esgotats"]])+
   card(["ATDOM"],"Ferides i continuïtat infermera al domicili","Meta: continuïtat infermera ≥ 75%. Ferides noves detectades amb foto.",at.length,50,[[avg(at)+"%","adherència"],[S.msgs.filter(function(m){return/ferida|nafra/i.test(m.title)}).length,"ferides notificades"]])+
  '</div><p class="note">Xifres d’exemple. L’explotació real seria anonimitzada i aprovada pel comitè d’ètica.</p>';
  return h;
}

/* ---------- shell ---------- */
function vMun(){
  var M=ui.mun,pm=pendingMsgs().length,pr=proposals().length;
  var T=[["ini","Inici","gauge",0],["pac","Pacients","users",0],["bus","Bústia","doc",pm],["dem","Previsió","bolt",0],["ia","Motius IA","sparkle",pr],["rec","Recerca","search",0]];
  var cur=M.pat?"pac":M.tab;
  var nav='<nav class="pnav" aria-label="Seccions">'+T.map(function(t){return'<button type="button" data-tab="'+t[0]+'" aria-current="'+(cur===t[0]?"page":"false")+'">'+ico(t[2],18)+'<span>'+t[1]+'</span>'+(t[3]?'<em class="cnt">'+t[3]+'</em>':'')+'</button>'}).join("")+'</nav>';
  var title=M.pat?"Fitxa del pacient":{ini:"Tauler",pac:"Pacients en seguiment",bus:"Bústia de consultes",dem:"Previsió de la demanda",ia:"Motius detectats per l’assistent",rec:"Recerca de l’equip"}[M.tab];
  var body=M.pat?vPat(M.pat):M.tab==="ini"?vIni():M.tab==="pac"?vPac():M.tab==="bus"?vBus():M.tab==="dem"?vDem():M.tab==="ia"?vIA():vRec();
  return'<div class="pro">'+nav+'<section class="pmain"><div class="ptitle"><h2>'+title+'</h2><span class="note">Microequip A i B · '+new Date().toLocaleDateString("ca",{weekday:"long",day:"numeric",month:"long"})+'</span></div>'+body+'</section></div>';
}
/* ---------- state, render, events ---------- */
var S=gen(Date.now()),HS=location.hash;S.dismissed=[];
var ui={screen:HS==="#innovamunt"||HS==="#familia"?"inn":HS==="#muntapp"?"mun":"home",inn:null,
  mun:{tab:"ini",pat:null,from:"pac",prog:"Tots",q:"",bs:"nou",bt:"all"},
  dm:{day:0,cut:0,scen:0,abs:-1,open:-1}};
innReset(false);
var app=document.getElementById("app");
function vHome(){
  return '<div class="home">'+
  '<div class="hero"><h1>Dues portes, un mateix equip</h1><p>InnovaMunt dona als pacients i a les famílies un accés directe al professional que els cal. MuntApp és el tauler de l’equip: consultes, evolució de cada pacient i previsió de la demanda.</p></div>'+
  '<div class="doors">'+
   '<button class="door inn" type="button" data-go="inn"><span class="ic">'+ico("heart",26)+'</span><b>InnovaMunt</b><span>Per a pacients i famílies. Pensat per al mòbil: trieu el pacient, què passa i a qui ho envieu.</span><em>Entrar com a família '+ico("chev",16)+'</em></button>'+
   '<button class="door mun" type="button" data-go="mun"><span class="ic">'+ico("gauge",26)+'</span><b>MuntApp</b><span>Per a professionals. Tauler per programa (ICC, DM2, PCC, MACA, ATDOM), fitxa de cada pacient i bústia.</span><em>Entrar com a professional '+ico("chev",16)+'</em></button>'+
  '</div>'+
  '<div class="how"><div><span class="hn">1</span><b>La família notifica</b><span>Constants, un problema nou, un dubte o un tràmit.</span></div><div><span class="hn">2</span><b>Arriba directe</b><span>A infermeria, medicina, treball social o la UAC, sense centraleta.</span></div><div><span class="hn">3</span><b>L’equip actua</b><span>Prioritat automàtica i evolució del pacient en una sola pantalla.</span></div></div>'+
  '<p class="note">Prototip amb dades fictícies. No introduïu dades reals de pacients.</p></div>';
}
function render(){
  document.body.dataset.screen=ui.screen;
  document.getElementById("brandName").textContent=ui.screen==="inn"?"InnovaMunt":ui.screen==="mun"?"MuntApp":"La Muntanyeta";
  app.innerHTML=ui.screen==="inn"?vInn():ui.screen==="mun"?vMun():vHome();
}
var tt;function toast(m){var o=document.querySelector(".toast");if(o)o.remove();var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(function(){t.remove()},2600)}
function go(s){if(s==="inn"&&ui.screen!=="inn")innReset(false);ui.screen=s;window.scrollTo(0,0);render()}
function numVar(k){return VARS[ui.inn.prof].concat([CUID]).filter(function(x){return x.k===k})[0]}
document.querySelector(".top").addEventListener("click",function(e){if(e.target.closest("[data-go]"))go("home")});
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset,I=ui.inn,M=ui.mun;
  if(d.go){if(d.go==="mun"){M.tab=ui.screen==="inn"?"bus":M.tab;M.pat=null}go(d.go);return}
  /* wizard */
  if(d.back){back();return}
  if(d.prof){I.prof=d.prof;I.vals=null;nav("what");return}
  if(d.what){I.what=d.what;I.signs={};I.note="";I.photo=null;I.to=null;I.pid=null;I.q="";I.via=null;I.tram=null;I.med="";if(d.what==="const")I.vals=null;nav(d.what==="prob"?"cat":d.what);return}
  if(d.cat){I.cat=d.cat;nav("list");return}
  if(d.pick){I.pid=d.pick;I.via=d.conf||null;I.signs={};nav("prob");return}
  if(d.free){I.pid="free";I.via=null;I.signs={};nav("prob");return}
  if(d.sig!=null){I.signs[d.sig]=!I.signs[d.sig];b.setAttribute("aria-pressed",!!I.signs[d.sig]);return}
  if(d.opt){I.vals[d.opt]=d.val;b.parentNode.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});return}
  var k=d.inc||d.dec;if(k){var v=numVar(k),inp=document.getElementById("in_"+k),n=parseFloat(String(inp.value).replace(",","."))||0;n=+(n+(d.inc?v.s:-v.s)).toFixed(v.s<1?1:0);if(k==="dolor")n=Math.max(0,Math.min(10,n));I.vals[k]=n;inp.value=fmt(n);return}
  if(d.tram!=null){I.tram=+d.tram;render();return}
  if(d.next){nav(d.next);return}
  if(d.to){I.to=d.to;nav("review");return}
  if(b.id==="iSend"){innSend();return}
  if(d["new"]){innReset(true);render();window.scrollTo(0,0);return}
  /* professional */
  if(d.pat){if(!M.pat)M.from=M.tab;M.pat=d.pat;render();window.scrollTo(0,0);return}
  if(d.tab){M.tab=d.tab;M.pat=null;render();window.scrollTo(0,0);return}
  if(d.prog){M.tab="pac";M.prog=d.prog;M.pat=null;render();window.scrollTo(0,0);return}
  if(d.pf){M.prog=d.pf;render();return}
  if(d.bs){M.bs=d.bs;render();return}
  if(d.bt){M.bt=d.bt;render();return}
  if(d.ma){msgAct(d.id,d.ma,d.to);return}
  if(d.rev){review(d.rev,d.note);return}
  if(d.pa){propAct(d.g,d.pa);return}
  if(d.dk){ui.dm[d.dk]=+d.di;if(d.dk==="day")ui.dm.open=-1;render();return}
  if(d.uba){var i=+d.uba;ui.dm.open=ui.dm.open===i?-1:i;render();return}
});
app.addEventListener("change",function(e){
  var t=e.target,I=ui.inn;
  if(t.id==="iPhoto"&&t.files&&t.files[0]){try{if(I.photo)URL.revokeObjectURL(I.photo)}catch(x){}I.photo=URL.createObjectURL(t.files[0]);render()}
  else if(t.id==="dAbs"){ui.dm.abs=+t.value;ui.dm.open=-1;render()}
});
app.addEventListener("input",function(e){
  var t=e.target,I=ui.inn;
  if(t.dataset&&t.dataset.k){var n=parseFloat(String(t.value).replace(",","."));I.vals[t.dataset.k]=isNaN(n)?"":n}
  else if(t.id==="iNote")I.note=t.value;else if(t.id==="iMed")I.med=t.value;
  else if(t.id==="iQ"){I.q=t.value;document.getElementById("sugg").innerHTML=suggHTML()}
  else if(t.id==="pQ"){ui.mun.q=t.value;render();var q=document.getElementById("pQ");q.focus();q.setSelectionRange(q.value.length,q.value.length)}
});
app.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="iQ"){var f=document.querySelector("#sugg [data-pick]");if(f)f.click();else{var fr=document.querySelector("#sugg [data-free]");if(fr)fr.click()}}});
window.addEventListener("hashchange",function(){var h=location.hash;go(h==="#innovamunt"||h==="#familia"?"inn":h==="#muntapp"?"mun":"home")});
render();
})();
</script>
</body>
</html>
